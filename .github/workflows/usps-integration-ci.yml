name: USPS Integration CI

on:
  push:
    branches:
      - usps-integration
    paths:
      - package.json
      - package-lock.json
      - server/usps.ts
      - server/routes.ts
      - server/replitAuth.ts
      - client/src/lib/usps.ts
      - client/src/pages/logistics/USPSServices.tsx
      - client/src/pages/logistics/Tracking.tsx
      - .github/workflows/usps-integration-ci.yml
  pull_request:
    branches:
      - replit-agent
    paths:
      - package.json
      - package-lock.json
      - server/usps.ts
      - server/routes.ts
      - server/replitAuth.ts
      - client/src/lib/usps.ts
      - client/src/pages/logistics/USPSServices.tsx
      - client/src/pages/logistics/Tracking.tsx
      - .github/workflows/usps-integration-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Build production bundle
        run: npm run build
