name: USPS Integration CI

on:
  push:
    branches:
      - usps-integration
    paths:
      - package.json
      - package-lock.json
      - server/usps.ts
      - server/routes.ts
      - server/replitAuth.ts
      - client/src/lib/usps.ts
      - client/src/pages/logistics/USPSServices.tsx
      - client/src/pages/logistics/Tracking.tsx
      - .github/workflows/usps-integration-ci.yml
  pull_request:
    branches:
      - replit-agent
    paths:
      - package.json
      - package-lock.json
      - server/usps.ts
      - server/routes.ts
      - server/replitAuth.ts
      - client/src/lib/usps.ts
      - client/src/pages/logistics/USPSServices.tsx
      - client/src/pages/logistics/Tracking.tsx
      - .github/workflows/usps-integration-ci.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: usps-integration
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(build): synchronize npm lockfile"
          git pull --rebase origin usps-integration
          git push origin HEAD:usps-integration

  verify:
    needs: sync-lockfile
    if: always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production bundle
        run: npm run build
