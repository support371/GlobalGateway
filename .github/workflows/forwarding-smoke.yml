name: Forwarding smoke test

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Preview or production base URL to test
        required: true
        type: string
      smoke_email:
        description: Email used to create and retrieve the synthetic order
        required: true
        type: string
      confirmation:
        description: Type CREATE_SYNTHETIC_FORWARDING_ORDER
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forwarding-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forwarding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "CREATE_SYNTHETIC_FORWARDING_ORDER" ]; then
            echo "The confirmation input must exactly match CREATE_SYNTHETIC_FORWARDING_ORDER"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run create and lookup verification
        env:
          FORWARDING_BASE_URL: ${{ inputs.deployment_url }}
          FORWARDING_SMOKE_EMAIL: ${{ inputs.smoke_email }}
          FORWARDING_SMOKE_CONFIRM: ${{ inputs.confirmation }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          FORWARDING_ADMIN_COOKIE: ${{ secrets.FORWARDING_ADMIN_COOKIE }}
        run: npm run smoke:forwarding
