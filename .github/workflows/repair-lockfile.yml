name: Repair npm lockfile
on:
  push:
    branches: [usps-integration]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/repair-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Repair lockfile without installing scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate npm lockfile for CI"
          git push origin HEAD:usps-integration
