name: GlobalGateway Verify

on:
  pull_request:
    branches:
      - replit-agent
  push:
    branches:
      - usps-integration

permissions:
  contents: read

concurrency:
  group: globalgateway-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production bundles
        run: npm run build
